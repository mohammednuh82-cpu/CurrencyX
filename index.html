<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CurrencyX - Currency Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Welcome to Mohammed's CurrencyX</h1>

        <p class="subtitle">
            Convert currencies quickly and easily.
        </p>

        <div class="converter-card">


            <div class="input-group">
                <label for="amount">Amount</label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="0"
                >
            </div>



            <div class="currency-section">


                <div class="currency-box">

                    <label for="fromCurrency">From</label>

                    <select id="fromCurrency">

                        <option value="INR">
                            INR - Indian Rupee
                        </option>

                        <option value="USD">
                            USD - US Dollar
                        </option>

                        <option value="EUR">
                            EUR - Euro
                        </option>

                        <option value="GBP">
                            GBP - British Pound
                        </option>

                        <option value="AED">
                            AED - UAE Dirham
                        </option>

                    </select>

                </div>



                <button
                    type="button"
                    id="swapBtn"
                    class="swap-button"
                >
                    ⇄
                </button>



                <div class="currency-box">

                    <label for="toCurrency">To</label>

                    <select id="toCurrency">

                        <option value="USD">
                            USD - US Dollar
                        </option>

                        <option value="INR">
                            INR - Indian Rupee
                        </option>

                        <option value="EUR">
                            EUR - Euro
                        </option>

                        <option value="GBP">
                            GBP - British Pound
                        </option>

                        <option value="AED">
                            AED - UAE Dirham
                        </option>

                    </select>

                </div>

            </div>



            <button
                type="button"
                id="convertBtn"
                class="convert-button"
            >
                Convert
            </button>



            <div class="result-box">

                <p class="result-label">
                    Conversion Result
                </p>

                <h2 id="result">
                    Your result will appear here
                </h2>

            </div>

        </div>

    </div>
    <script src="script.js"></script>

</body>
</html>
</body>

</html>
